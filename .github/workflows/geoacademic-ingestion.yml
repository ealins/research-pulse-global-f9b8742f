name: GeoAcademic fresh ingestion

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy GeoAcademic to Cloudflare"]
    types: [completed]
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

concurrency:
  group: geoacademic-ingestion-manual
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review-jobs:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GEOACADEMIC_BASE_URL: https://geoacademic.app
      INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
      OMNIROUTE_URL: "https://omniroute.geoacademic.app/v1"
      OMNIROUTE_MODEL: "auto"
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_MODEL: "gemini-2.5-flash"
      REVIEW_RUNTIME_MS: "210000"
      REVIEW_LEASE_LIMIT: "4"
      REVIEW_CONCURRENCY: "2"
    steps:
      - name: Check out worker
        uses: actions/checkout@v4
      - name: Validate worker
        run: node scripts/job-review-worker.mjs --self-test
      - name: Verify fetch lease endpoint
        shell: bash
        env:
          INGESTION_HOOK_SECRET: ${{ secrets.INGESTION_HOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$INGESTION_HOOK_SECRET"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -H "Authorization: Bearer $INGESTION_HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"action":"lease-fetch","limit":1,"trigger":"github-actions-lease-smoke"}' \
            https://geoacademic.app/api/public/hooks/ingest-batch \
            | tee /tmp/lease.json
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("/tmp/lease.json","utf8"));
            if (!Array.isArray(v.leases)) throw new Error("lease-fetch returned no leases array");
            if (v.leases.length < 1) throw new Error("lease-fetch returned zero leases while FETCH backlog is expected");
            console.log("LEASE_SMOKE_OK", JSON.stringify({count:v.leases.length, task_id:v.leases[0]?.task_id}));
          '
      - name: Fetch fresh source data first
        env:
          INGESTION_FETCH_CONCURRENCY: "6"
          INGESTION_LEASE_LIMIT: "12"
          INGESTION_RUNTIME_MS: "150000"
          INGESTION_BURST_MODE: "true"
          INGESTION_WORKER_TRIGGER: "github-actions-fresh-first"
        run: node scripts/ingestion-worker.mjs
      - name: Drain vacancy review backlog
        env:
          REVIEW_RUNTIME_MS: "120000"
          REVIEW_LEASE_LIMIT: "6"
          REVIEW_CONCURRENCY: "2"
        run: node scripts/job-review-worker.mjs
      - name: Review newly fetched job pages
        env:
          REVIEW_RUNTIME_MS: "45000"
          REVIEW_LEASE_LIMIT: "4"
          REVIEW_CONCURRENCY: "2"
        run: node scripts/job-review-worker.mjs
