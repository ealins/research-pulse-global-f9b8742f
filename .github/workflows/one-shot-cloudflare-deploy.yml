name: One-shot Cloudflare deployment

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
      - name: Install dependencies
        run: npx --yes bun@1.3.14 install --frozen-lockfile
      - name: Build
        run: npx --yes bun@1.3.14 run build
      - name: Deploy
        run: ./node_modules/.bin/wrangler deploy
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-cloudflare-deploy.yml
          git add .github/workflows/one-shot-cloudflare-deploy.yml
          git commit -m "Remove one-shot Cloudflare deployment workflow" || exit 0
          git push origin HEAD:main
