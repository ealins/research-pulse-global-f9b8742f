name: GeoAcademic Cloud ingestion (scheduled fallback)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_fetch:
        description: Maximum FETCH tasks this run
        required: false
        default: "100"
      max_process:
        description: "Maximum EXTRACT tasks to run"
        required: false
        default: "100"
  schedule:
    # 4-hour bounded ingestion cycle (6x daily); inert until
    # GEOACADEMIC_DATABASE_URL and GEOACADEMIC_S3_* secrets are configured.
    - cron: "15 */4 * * *"

permissions:
  contents: read

concurrency:
  group: geoacademic-ingestion-fallback
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check ingestion secrets
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.GEOACADEMIC_DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.GEOACADEMIC_S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.GEOACADEMIC_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.GEOACADEMIC_S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.GEOACADEMIC_S3_BUCKET }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$S3_ENDPOINT" ] && \
             [ -n "$S3_ACCESS_KEY" ] && [ -n "$S3_SECRET_KEY" ] && \
             [ -n "$S3_BUCKET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled fallback is inert until GEOACADEMIC_DATABASE_URL and GEOACADEMIC_S3_* secrets are configured."
          fi

      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: open-engine/worker/requirements.txt

      - name: Validate database URL format
        if: steps.preflight.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.GEOACADEMIC_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw = os.environ["DATABASE_URL"]
          value = raw.strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in {"'", '"'}:
              value = value[1:-1].strip()

          parsed = urlsplit(value)
          scheme = parsed.scheme.lower()
          print(f"DATABASE_URL present: {bool(raw)}")
          print(f"DATABASE_URL length: {len(raw)}")
          print(f"DATABASE_URL scheme: {scheme or '<missing>'}")
          print(f"DATABASE_URL host present: {bool(parsed.hostname)}")

          if scheme not in {"postgresql", "postgres"}:
              raise SystemExit(
                  "GEOACADEMIC_DATABASE_URL is malformed: expected "
                  "postgresql:// or postgres://."
              )
          PY

      - name: Install ingestion dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: pip install -r open-engine/worker/requirements.txt

      - name: Run bounded ingestion cycle and QA
        if: steps.preflight.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.GEOACADEMIC_DATABASE_URL }}
          DB_SCHEMA: geoacademic_engine
          S3_ENDPOINT: ${{ secrets.GEOACADEMIC_S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.GEOACADEMIC_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.GEOACADEMIC_S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.GEOACADEMIC_S3_BUCKET }}
          WORKER_CONCURRENCY: "8"
          FETCH_TIMEOUT_SECONDS: "25"
          AI_FALLBACK_ENABLED: "true"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_FETCH: ${{ github.event.inputs.max_fetch || '100' }}
          MAX_PROCESS: ${{ github.event.inputs.max_process || '100' }}
        run: |
          python open-engine/cloudrun/batch_runner.py all \
            --max-fetch "$MAX_FETCH" \
            --max-process "$MAX_PROCESS"
          python open-engine/cloudrun/qa_database.py
