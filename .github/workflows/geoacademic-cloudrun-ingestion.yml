name: GeoAcademic Cloud ingestion

on:
  workflow_dispatch:
    inputs:
      max_fetch:
        description: Maximum FETCH tasks this run
        required: false
        default: "40"
      max_process:
        description: Maximum EXTRACT tasks this run
        required: false
        default: "40"
  schedule:
    - cron: "43 */2 * * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check ingestion secrets
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.GEOACADEMIC_DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.GEOACADEMIC_S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.GEOACADEMIC_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.GEOACADEMIC_S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.GEOACADEMIC_S3_BUCKET }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$S3_ENDPOINT" ] && \
             [ -n "$S3_ACCESS_KEY" ] && [ -n "$S3_SECRET_KEY" ] && \
             [ -n "$S3_BUCKET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloud ingestion is inert until GEOACADEMIC_DATABASE_URL and GEOACADEMIC_S3_* secrets are configured."
          fi

      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: open-engine/worker/requirements.txt

      - name: Install ingestion dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: pip install -r open-engine/worker/requirements.txt

      - name: Run bounded ingestion cycle
        if: steps.preflight.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.GEOACADEMIC_DATABASE_URL }}
          DB_SCHEMA: geoacademic_engine
          S3_ENDPOINT: ${{ secrets.GEOACADEMIC_S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.GEOACADEMIC_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.GEOACADEMIC_S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.GEOACADEMIC_S3_BUCKET }}
          WORKER_CONCURRENCY: "4"
          FETCH_TIMEOUT_SECONDS: "25"
          AI_FALLBACK_ENABLED: "true"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          MAX_FETCH: ${{ github.event.inputs.max_fetch || '40' }}
          MAX_PROCESS: ${{ github.event.inputs.max_process || '40' }}
        run: |
          python open-engine/cloudrun/batch_runner.py all \
            --max-fetch "$MAX_FETCH" \
            --max-process "$MAX_PROCESS"
