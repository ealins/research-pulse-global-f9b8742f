name: GeoAcademic data QA

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ["GeoAcademic Cloud ingestion (scheduled fallback)"]
    types: [completed]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: open-engine/worker/requirements.txt

      - name: Install QA dependency
        run: pip install asyncpg==0.30.0

      - name: Validate canonical data and public read models
        env:
          DATABASE_URL: ${{ secrets.GEOACADEMIC_DATABASE_URL }}
          DB_SCHEMA: geoacademic_engine
        run: |
          echo "QA trigger: $GITHUB_EVENT_NAME"
          if [ -z "$DATABASE_URL" ]; then
            echo "GEOACADEMIC_DATABASE_URL secret is not configured. Skipping QA check gracefully."
            exit 0
          fi
          python open-engine/cloudrun/qa_database.py
