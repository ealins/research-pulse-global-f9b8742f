name: GeoAcademic seed sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install database dependency
        run: pip install asyncpg==0.30.0

      - name: Seed public institution catalog and web-ingestion queue
        env:
          DATABASE_URL: ${{ secrets.GEOACADEMIC_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "Missing GEOACADEMIC_DATABASE_URL"; exit 1; }
          python open-engine/cloudrun/seed_public_catalog.py

      - name: Seed open-engine source registry
        env:
          DATABASE_URL: ${{ secrets.GEOACADEMIC_DATABASE_URL }}
          DB_SCHEMA: geoacademic_engine
        run: |
          python open-engine/worker/seed.py \
            https://www.isprs.org/job_opportunities/default.aspx \
            https://www.isprs.org/calendar/2026.aspx \
            https://www.isprs.org/calendar/2027.aspx \
            https://www.egu.eu/g/jobs/ \
            https://earthobservations.org/about-us/events

      - name: Next step
        run: |
          echo "Public institutions and both ingestion queues are seeded."
          echo "Run GeoAcademic Cloud ingestion, then GeoAcademic ingestion burst."
