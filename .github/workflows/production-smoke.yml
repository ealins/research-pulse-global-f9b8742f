name: GeoAcademic production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose production API targets
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://geoacademic.app"
          ORACLE_ENGINE="https://api.geoacademic.app"
          LEGACY_ENGINE="https://geoacademic-api-xjh4s3mvyq-ey.a.run.app"

          page_code=$(curl -L -sS -o /tmp/home.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$SITE/" || true)
          health_code=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 10 --max-time 30 "$SITE/api/public/data-health" || true)
          oracle_code=$(curl -L -sS -o /tmp/oracle.json -w '%{http_code}' --connect-timeout 10 --max-time 30 "$ORACLE_ENGINE/health" || true)
          legacy_code=$(curl -L -sS -o /tmp/legacy.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$LEGACY_ENGINE/health" || true)

          echo "HTTP codes: home=$page_code health=$health_code oracle=$oracle_code legacy=$legacy_code"
          echo "--- site health ---"; [[ -s /tmp/health.json ]] && cat /tmp/health.json || true; echo
          echo "--- Oracle API ---"; [[ -s /tmp/oracle.json ]] && cat /tmp/oracle.json || true; echo
          echo "--- legacy Cloud Run API ---"; [[ -s /tmp/legacy.html ]] && head -c 2000 /tmp/legacy.html || true; echo

          [[ "$page_code" == "200" ]]
          [[ "$oracle_code" == "200" ]]
          grep -q "Research Pulse" /tmp/home.html
