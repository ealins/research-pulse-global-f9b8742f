name: One-shot loader data repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-loaderdata-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run one-shot loader data repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Render index pages from serialized loader data
        run: |
          python <<'PY'
          from pathlib import Path

          jobs = Path('src/routes/jobs.index.tsx')
          text = jobs.read_text()
          text = text.replace('import { useQuery } from "@tanstack/react-query";\n', '')
          old = '  const { data, isLoading, error } = useQuery(opportunitiesQuery);'
          new = '  const data = Route.useLoaderData();\n  const isLoading = false;\n  const error = null;'
          if old not in text and new not in text:
              raise SystemExit('Jobs useQuery anchor not found')
          text = text.replace(old, new, 1)
          jobs.write_text(text)

          events = Path('src/routes/events.index.tsx')
          text = events.read_text()
          text = text.replace('import { useQuery } from "@tanstack/react-query";\n', '')
          old = '  const { data, isLoading, error } = useQuery(eventsQuery);'
          new = '  const data = Route.useLoaderData();\n  const isLoading = false;\n  const error = null;'
          if old not in text and new not in text:
              raise SystemExit('Events useQuery anchor not found')
          text = text.replace(old, new, 1)
          events.write_text(text)
          PY

      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Commit repair
        run: |
          git config user.name "GeoAcademic CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A src/routes src/routeTree.gen.ts
          git rm .github/workflows/one-shot-loaderdata-repair.yml
          git commit -m "Render jobs and events from route loader data"
          git push origin HEAD:main
