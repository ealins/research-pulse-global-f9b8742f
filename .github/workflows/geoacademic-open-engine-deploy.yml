name: Deploy GeoAcademic open engine to Oracle

on:
  workflow_dispatch:

concurrency:
  group: geoacademic-open-engine-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
      ORACLE_DEPLOY_PATH: ${{ secrets.ORACLE_DEPLOY_PATH }}
    steps:
      - name: Require Oracle deployment configuration
        shell: bash
        run: |
          if [ -z "$ORACLE_HOST" ] || [ -z "$ORACLE_USER" ] || [ -z "$ORACLE_SSH_PRIVATE_KEY" ] || [ -z "$ORACLE_SSH_KNOWN_HOSTS" ] || [ -z "$ORACLE_DEPLOY_PATH" ]; then
            echo "Oracle deployment secrets are not configured." >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$HOME/.ssh/geoacademic_oracle"
          chmod 600 "$HOME/.ssh/geoacademic_oracle"
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy current main on Oracle
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/geoacademic_oracle" "$ORACLE_USER@$ORACLE_HOST" \
            "set -euo pipefail; cd '$ORACLE_DEPLOY_PATH'; git fetch origin main; git checkout main; git reset --hard origin/main; cd open-engine; chmod +x deploy-oracle.sh; ./deploy-oracle.sh"

      - name: Verify public API
        run: curl --fail --silent --show-error --max-time 30 https://api.geoacademic.app/health
